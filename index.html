<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ukraine-Krieg // Live-News & Analysen</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0a0b0d',
                        cardBg: '#12141a',
                        borderCol: '#232733',
                        accentRed: '#ef4444'
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & Alpine.js für Interaktivität -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-[#0a0b0d] text-gray-100 min-h-screen flex flex-col justify-between selection:bg-red-500 selection:text-white" 
      x-data="liveNewsApp()" x-init="fetchNews()">

    <!-- Top Header -->
    <header class="border-b border-[#232733] bg-[#12141a]/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-3 h-3 bg-red-500 rounded-full animate-pulse"></div>
                <h1 class="font-bold tracking-wider text-lg uppercase mono text-white">UKRAINE // LIVE-FEED (AUTO)</h1>
            </div>
            <div class="flex items-center space-x-3">
                <span class="text-xs text-gray-400 hidden sm:inline mono">LIVE API: ONLINE</span>
                <button @click="fetchNews()" class="bg-[#1f242d] hover:bg-[#282f3d] text-gray-300 text-xs px-3 py-1.5 rounded-lg border border-[#232733] transition flex items-center space-x-1.5">
                    <svg :class="{'animate-spin': loading}" class="w-3.5 h-3.5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span x-text="loading ? 'Lade Live-Daten...' : 'Aktualisieren'"></span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-5xl mx-auto px-4 py-6 w-full flex-grow">
        
        <!-- Search & Info Bar -->
        <div class="flex flex-col md:flex-row justify-between items-stretch md:items-center gap-4 mb-6">
            <div class="text-xs text-gray-400">
                <span class="text-red-500 font-semibold">Live-Ticker:</span> Zieht automatische Schlagzeilen aus globalen Quellen.
            </div>

            <!-- Search Input -->
            <div class="relative w-full md:w-64">
                <input type="text" x-model="search" placeholder="Feed durchsuchen..." class="w-full bg-[#12141a] text-sm text-gray-200 placeholder-gray-500 px-3.5 py-2 pl-9 rounded-xl border border-[#232733] focus:outline-none focus:border-red-500 transition">
                <svg class="w-4 h-4 text-gray-500 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
        </div>

        <!-- Lade-Animation -->
        <div x-show="loading" class="text-center py-20">
            <div class="inline-block w-8 h-8 border-4 border-red-500 border-t-transparent rounded-full animate-spin mb-3"></div>
            <p class="text-xs text-gray-400 mono">Verbinde mit Live-Feeds...</p>
        </div>

        <!-- News Feed List -->
        <div class="space-y-4" x-show="!loading">
            <template x-for="item in filteredNews()" :key="item.link">
                <article class="bg-[#12141a] border border-[#232733] rounded-2xl p-5 hover:border-gray-700 transition shadow-lg relative overflow-hidden group">
                    
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                        <span class="text-[10px] font-semibold uppercase tracking-wider px-2.5 py-0.5 rounded-md bg-[#1f242d] text-gray-300 border border-[#282f3d]" x-text="item.source"></span>
                        <span class="text-xs text-gray-500 mono" x-text="item.pubDate"></span>
                    </div>

                    <h2 class="text-base font-bold text-gray-100 mb-2 group-hover:text-red-400 transition" x-text="item.title"></h2>
                    <p class="text-sm text-gray-300 mb-4 leading-relaxed" x-text="item.snippet"></p>

                    <div class="flex justify-end">
                        <a :href="item.link" target="_blank" class="text-xs text-red-400 hover:text-red-300 font-medium flex items-center space-x-1 transition">
                            <span>Vollständigen Artikel lesen</span>
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                        </a>
                    </div>
                </article>
            </template>

            <!-- Fallback wenn nichts gefunden wird -->
            <div x-show="!loading && filteredNews().length === 0" class="text-center py-16 bg-[#12141a] border border-[#232733] rounded-2xl">
                <p class="text-gray-400 text-sm">Keine passenden Live-Meldungen gefunden.</p>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-[#232733] py-6 text-center text-xs text-gray-500 bg-[#12141a] mt-12">
        <p>&copy; 2026 &bull; Automated Live Intelligence Feed</p>
    </footer>

    <!-- JavaScript für den automatischen Live-Abruf -->
    <script>
        function liveNewsApp() {
            return {
                search: '',
                loading: true,
                news: [],
                async fetchNews() {
                    this.loading = true;
                    try {
                        // Wir nutzen einen kostenlosen RSS-to-JSON Converter für den Google News RSS Feed zum Ukraine-Krieg
                        const rssUrl = 'https://news.google.com/rss/search?q=Ukraine+war&hl=en-US&gl=US&ceid=US:en';
                        const api = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
                        
                        const response = await fetch(api);
                        const data = await response.json();
                        
                        if (data.status === 'ok') {
                            this.news = data.items.map(item => {
                                // Datum lesbarer machen
                                let date = new Date(item.pubDate);
                                let timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' - ' + date.toLocaleDateString();
                                
                                // HTML-Tags aus der Beschreibung entfernen für saubere Snippets
                                let tempDiv = document.createElement('div');
                                tempDiv.innerHTML = item.description || '';
                                let cleanText = tempDiv.textContent || tempDiv.innerText || '';
                                if(cleanText.length > 180) cleanText = cleanText.substring(0, 180) + '...';

                                return {
                                    title: item.title,
                                    link: item.link,
                                    pubDate: timeStr,
                                    source: item.author || 'Live Wire',
                                    snippet: cleanText || 'Keine Vorschau verfügbar.'
                                };
                            });
                        }
                    } catch (error) {
                        console.error('Fehler beim Laden der News:', error);
                    } finally {
                        this.loading = false;
                    }
                },
                filteredNews() {
                    if (!this.news) return [];
                    return this.news.filter(item => {
                        return this.search === '' || 
                            item.title.toLowerCase().includes(this.search.toLowerCase()) || 
                            item.snippet.toLowerCase().includes(this.search.toLowerCase());
                    });
                }
            }
        }
    </script>
</body>
</html>
