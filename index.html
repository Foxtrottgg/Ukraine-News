<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ukraine-Krieg // Live-News & Analysen</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0a0b0d',
                        cardBg: '#12141a',
                        borderCol: '#232733',
                        accentRed: '#ef4444'
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & Alpine.js -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-[#0a0b0d] text-gray-100 min-h-screen flex flex-col justify-between selection:bg-red-500 selection:text-white" 
      x-data="newsApp()">

    <!-- Top Header -->
    <header class="border-b border-[#232733] bg-[#12141a]/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-3 h-3 bg-red-500 rounded-full animate-pulse"></div>
                <h1 class="font-bold tracking-wider text-lg uppercase mono text-white">UKRAINE // INTELLIGENCE FEED</h1>
            </div>
            <div class="flex items-center space-x-3">
                <span class="text-xs text-gray-400 hidden sm:inline mono">STATUS: SECURE</span>
                <button @click="triggerRefresh()" class="bg-[#1f242d] hover:bg-[#282f3d] text-gray-300 text-xs px-3 py-1.5 rounded-lg border border-[#232733] transition flex items-center space-x-1.5">
                    <svg :class="{'animate-spin': refreshing}" class="w-3.5 h-3.5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span x-text="refreshing ? 'Synchronisiere...' : 'Aktualisieren'"></span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-4xl mx-auto px-4 py-8 w-full flex-grow">
        
        <!-- Controls & Search -->
        <div class="flex flex-col md:flex-row justify-between items-stretch md:items-center gap-4 mb-8">
            <div class="flex flex-wrap gap-1.5 bg-[#12141a] p-1 rounded-xl border border-[#232733]">
                <button @click="tab = 'all'" :class="tab === 'all' ? 'bg-red-600 text-white font-medium shadow' : 'text-gray-400 hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-xs transition">Alle Meldungen</button>
                <button @click="tab = 'tech'" :class="tab === 'tech' ? 'bg-red-600 text-white font-medium shadow' : 'text-gray-400 hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-xs transition">Tech & Drohnen</button>
                <button @click="tab = 'diplomacy'" :class="tab === 'diplomacy' ? 'bg-red-600 text-white font-medium shadow' : 'text-gray-400 hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-xs transition">Diplomatie</button>
                <button @click="tab = 'energy'" :class="tab === 'energy' ? 'bg-red-600 text-white font-medium shadow' : 'text-gray-400 hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-xs transition">Energie & Logistik</button>
            </div>

            <div class="relative w-full md:w-64">
                <input type="text" x-model="search" placeholder="Feed durchsuchen..." class="w-full bg-[#12141a] text-sm text-gray-200 placeholder-gray-500 px-3.5 py-2 pl-9 rounded-xl border border-[#232733] focus:outline-none focus:border-red-500 transition">
                <svg class="w-4 h-4 text-gray-500 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
        </div>

        <!-- News Feed List -->
        <div class="space-y-4">
            <template x-for="item in filteredNews()" :key="item.id">
                <article class="bg-[#12141a] border border-[#232733] rounded-2xl p-6 hover:border-gray-700 transition shadow-lg relative overflow-hidden group">
                    <div x-show="item.urgent" class="absolute left-0 top-0 bottom-0 w-1 bg-red-500"></div>

                    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                        <div class="flex items-center space-x-2">
                            <span class="text-[10px] font-semibold uppercase tracking-wider px-2.5 py-0.5 rounded-md bg-[#1f242d] text-gray-300 border border-[#282f3d]" x-text="item.categoryLabel"></span>
                            <span x-show="item.urgent" class="text-[10px] font-bold text-red-400 bg-red-950/40 border border-red-900/50 px-2 py-0.5 rounded-md">WICHTIG</span>
                        </div>
                        <span class="text-xs text-gray-500 mono" x-text="item.time"></span>
                    </div>

                    <h2 class="text-lg font-bold text-gray-100 mb-2 group-hover:text-red-400 transition" x-text="item.title"></h2>
                    <p class="text-sm text-gray-300 mb-3 leading-relaxed" x-text="item.summary"></p>
                    <p class="text-xs text-gray-400 bg-[#0a0b0d]/60 p-3.5 rounded-xl border border-[#232733] leading-relaxed" x-text="item.details"></p>
                </article>
            </template>

            <div x-show="filteredNews().length === 0" class="text-center py-16 bg-[#12141a] border border-[#232733] rounded-2xl">
                <p class="text-gray-400 text-sm">Keine passenden Meldungen gefunden.</p>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-[#232733] py-6 text-center text-xs text-gray-500 bg-[#12141a] mt-12">
        <p>&copy; 2026 &bull; Ukraine-Krieg Live Intelligence Portal</p>
    </footer>

    <!-- App Logic -->
    <script>
        function newsApp() {
            return {
                tab: 'all',
                search: '',
                refreshing: false,
                triggerRefresh() {
                    this.refreshing = true;
                    setTimeout(() => { this.refreshing = false; }, 800);
                },
                news: [
                    {
                        id: 1,
                        category: 'tech',
                        categoryLabel: 'Militär & Technologie',
                        time: 'Vor 15 Min.',
                        title: 'Starlink-Drosselung nach US-Gesprächen offenbar aufgehoben',
                        summary: 'Nach Medienberichten und Gesprächen zwischen Washington und Tech-Verantwortlichen wurden Beschränkungen für das Satellitensystem in der Ukraine angepasst.',
                        details: 'Die Ukraine ist für ihre taktische Kommunikation und Drohnensteuerung massiv auf stabile Verbindungen angewiesen, um Operationen an der Front aufrechtzuerhalten.',
                        urgent: true
                    },
                    {
                        id: 2,
                        category: 'diplomacy',
                        categoryLabel: 'Diplomatie & Politik',
                        time: 'Vor 45 Min.',
                        title: 'Erhöhte diplomatische Aktivitäten und Debatte über Sicherheitsgarantien',
                        summary: 'Internationale Partner beraten über Rahmenbedingungen für mögliche künftige Verhandlungswege und rechtlich bindende Sicherheitszusagen für Kiew.',
                        details: 'Während europäische Staaten auf eine direkte Einbindung bestehen, bleiben die Positionen zu territorialen Fragen und Garantien zwischen den Konfliktparteien verhärtet.',
                        urgent: true
                    },
                    {
                        id: 3,
                        category: 'tech',
                        categoryLabel: 'Militär & Technologie',
                        time: 'Vor 2 Std.',
                        title: 'Massiver Ausbau von Boden-Drohnen (UGVs) und KI-Zielerfassung',
                        summary: 'Der technologische Fokus verlagert sich stark auf unbemannte Bodenfahrzeuge für Logistik, Minenräumung und den sicheren Transport von Verwundeten.',
                        details: 'Zehntausende solcher Systeme wurden geordert. Onboard-KI soll helfen, elektronische Gegenmaßnahmen (Jamming) des Gegners an der Front zu umgehen.',
                        urgent: false
                    },
                    {
                        id: 4,
                        category: 'energy',
                        categoryLabel: 'Energie & Logistik',
                        time: 'Vor 3 Std.',
                        title: 'Dezentralisierung der Energieinfrastruktur vor anstehenden Monaten',
                        summary: 'Mit mobilen Kraftwerken und kleineren Gasturbinen versucht die Ukraine, die Strom- und Wärmeversorgung gegen Angriffe abzusichern.',
                        details: 'Lehren aus den Vorjahren führen zu einem verstärkten Schutz kritischer Knotenpunkte durch zusätzliche Luftabwehr und dezentrale Einheiten.',
                        urgent: false
                    }
                ],
                filteredNews() {
                    return this.news.filter(item => {
                        let matchesTab = this.tab === 'all' || item.category === this.tab;
                        let matchesSearch = this.search === '' || 
                            item.title.toLowerCase().includes(this.search.toLowerCase()) || 
                            item.summary.toLowerCase().includes(this.search.toLowerCase());
                        return matchesTab && matchesSearch;
                    });
                }
            }
        }
    </script>
</body>
</html>
